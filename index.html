<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Publicación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="custom.css">
</head>

<body>

    <header id="page-header">
        <h1>Muro de la Clase</h1>
        <p>Comparte algo con tus compañeros</p>
    </header>

    <main class="container my-4">
        <section class="mb-5">
            <form id="post-form" class="card p-4 shadow-sm">
                <div class="mb-3">
                    <label for="student-name" class="form-label">Nombre</label>
                    <input type="text" id="student-name" name="student-name" class="form-control" required
                        maxlength="40" placeholder="Escribe tu nombre">
                </div>

                <div class="mb-3">
                    <label for="message-text" class="form-label">Mensaje</label>
                    <textarea id="message-text" name="message-text" class="form-control" rows="3" required
                        maxlength="200" placeholder="¿Qué quieres compartir?"></textarea>
                    <div id="char-counter">200</div>
                </div>

                <div class="mb-3">
                    <label for="post-tag" class="form-label">Tema</label>
                    <select id="post-tag" class="form-select" aria-label="Selecciona una etiqueta para la publicación">
                        <option value="General">General</option>
                        <option value="Estudio">Estudio</option>
                        <option value="Evento">Evento</option>
                        <option value="Ayuda">Ayuda</option>
                    </select>
                </div>

                <div class="post-form-actions d-flex justify-content-end align-items-center gap-2 mt-2">
                    <button type="button" id="discard-draft-btn" class="btn btn-outline-secondary btn-sm">Descartar borrador</button>
                    <button type="submit" id="publish-btn" class="btn btn-primary">Publicar</button>
                </div>
            </form>
        </section>

        <section class="mb-3 px-3 pt-3">
            <form id="search-form" class="d-flex gap-2">
                <input type="text" id="search-input" class="form-control" placeholder="Buscar por autor o contenido" aria-label="Buscar publicaciones">
                <button type="submit" class="btn btn-outline-primary">Buscar</button>
            </form>
            <div id="search-help" class="form-text">Busca por nombre, mensaje o comentario.</div>
            <div class="sort-control mt-3">
                <label for="sort-select" class="form-label mb-0">Ordenar por</label>
                <select id="sort-select" class="form-select" aria-label="Ordenar publicaciones">
                    <option value="recent">Recientes</option>
                    <option value="oldest">Antiguas</option>
                    <option value="most-liked">Más gustadas</option>
                </select>
            </div>
            <div class="filter-control mt-3">
                <label for="tag-filter" class="form-label mb-0">Filtrar por tema</label>
                <select id="tag-filter" class="form-select" aria-label="Filtrar publicaciones por tema">
                    <option value="Todas">Todas</option>
                    <option value="General">General</option>
                    <option value="Estudio">Estudio</option>
                    <option value="Evento">Evento</option>
                    <option value="Ayuda">Ayuda</option>
                </select>
            </div>
            <div class="favorites-filter-control mt-3">
                <input class="form-check-input" type="checkbox" id="favorites-only-filter">
                <label class="form-check-label" for="favorites-only-filter">Mostrar únicamente favoritas</label>
            </div>
        </section>

        <section id="activity-summary" class="activity-summary px-3 py-3" aria-live="polite">
            <div class="activity-summary__title">
                <h2>Resumen de actividad</h2>
                <p>Totales calculados directamente desde las publicaciones.</p>
            </div>
            <div class="activity-summary__grid">
                <article class="activity-summary__card">
                    <span class="activity-summary__label">Publicaciones</span>
                    <strong id="summary-posts-count" class="activity-summary__value">0</strong>
                </article>
                <article class="activity-summary__card">
                    <span class="activity-summary__label">Reacciones</span>
                    <strong id="summary-likes-count" class="activity-summary__value">0</strong>
                </article>
                <article class="activity-summary__card">
                    <span class="activity-summary__label">Comentarios</span>
                    <strong id="summary-comments-count" class="activity-summary__value">0</strong>
                </article>
            </div>
        </section>

        <section id="feed-container">

        </section>
    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <script src="main.js"></script>
</body>

</html>
